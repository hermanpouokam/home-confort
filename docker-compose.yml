version: '3.8'

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: homeconfort
      POSTGRES_USER: hc_user
      POSTGRES_PASSWORD: hc_secret
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hc_user -d homeconfort"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://hc_user:hc_secret@db:5432/homeconfort
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-super_secret_key_change_in_production_32chars}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      WHATSAPP_ADMIN_NUMBER: ${WHATSAPP_ADMIN_NUMBER:-}
      WHATSAPP_API_TOKEN: ${WHATSAPP_API_TOKEN:-}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
    ports:
      - "3000:3000"
    volumes:
      - uploads:/app/public/uploads

volumes:
  pgdata:
  uploads: